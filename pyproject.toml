[build-system]
requires = ["setuptools>=70.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bubba_nodes"
version = "3.0.0"
description = "Custom ComfyUI nodes for metadata-first prompt, generation, image, and save workflows."
authors = [
  {name = "bubbafett5611", email = "metalgfx@gmail.com"}
]
readme = "README.md"
license = {text = "GNU General Public License v3"}
requires-python = ">=3.10"
classifiers = []
dependencies = [
    "aiohttp>=3.9",
    "pydantic>=2.0",
]



[project.optional-dependencies]
detailer = [
    "ultralytics>=8.0,<9",
]
dev = [
    "bump-my-version",
    "coverage",  # testing
    "mypy",  # linting
    "pre-commit", # runs linting on commit
    "pytest",  # testing
    "ruff",  # linting
]

[project.urls]
Repository = "https://github.com/bubbafett5611/Bubba_Nodes"
BugTracker = "https://github.com/bubbafett5611/Bubba_Nodes/issues"
Documentation = "https://github.com/bubbafett5611/Bubba_Nodes/wiki"


[tool.comfy]
PublisherId = "bubbafett5611"
DisplayName = "Bubba Nodes"
Icon = ""
Tags = []
Repository = "https://github.com/bubbafett5611/Bubba_Nodes"
requires-comfyui = ">=0.27.0"

includes = []

[tool.setuptools.package-data]
"*" = ["*.*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = [
    "tests",
]

[tool.mypy]
files = ["src", "tests"]
explicit_package_bases = true
python_version = "3.10"
check_untyped_defs = true
disallow_untyped_defs = false
disallow_untyped_calls = false
warn_return_any = false
warn_unused_ignores = false
warn_unreachable = true
warn_no_return = true

[[tool.mypy.overrides]]
# Don't require test functions to include types
module = "tests.*"
allow_untyped_defs = true
disable_error_code = "attr-defined"

[[tool.mypy.overrides]]
module = [
    "comfy",
    "comfy.*",
    "comfy_api",
    "comfy_api.*",
    "comfy_extras",
    "comfy_extras.*",
    "folder_paths",
    "node_helpers",
    "nodes",
    "server",
    "ultralytics",
]
ignore_missing_imports = true

[tool.ruff]
# extend-exclude = ["static", "ci/templates"]
line-length = 140
src = ["src", "tests"]
target-version = "py310"

# Add rules to ban exec/eval
[tool.ruff.lint]
select = [
    "S102",  # exec-builtin
    "S307",  # eval-used
    "W293",
    "F",  # The "F" series in Ruff stands for "Pyflakes" rules, which catch various Python syntax errors and undefined names.
    # See all rules here: https://docs.astral.sh/ruff/rules/#pyflakes-f
]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "double"
