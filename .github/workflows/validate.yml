name: Validate backwards compatibility

on:
  pull_request:
    branches:
      - master
      - main

jobs:
  previous-stable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Smoke test against ComfyUI v0.26.2
        run: |
          python -m pip install --upgrade pip
          git clone --depth 1 --branch v0.26.2 https://github.com/Comfy-Org/ComfyUI.git ../ComfyUI-v0.26.2
          mkdir -p ../ComfyUI-v0.26.2/custom_nodes
          ln -s "$GITHUB_WORKSPACE" ../ComfyUI-v0.26.2/custom_nodes/bubba_nodes
          python -m pip install -e ".[dev]"
          python -m pip install -r ../ComfyUI-v0.26.2/requirements.txt
          python - <<'PY'
          import asyncio
          import importlib
          import sys

          sys.path.insert(0, "../ComfyUI-v0.26.2")
          sys.path.insert(0, "../ComfyUI-v0.26.2/custom_nodes")
          module = importlib.import_module("bubba_nodes")
          extension = asyncio.run(module.comfy_entrypoint())
          nodes = asyncio.run(extension.get_node_list())
          assert len(nodes) == 37
          for node in nodes:
              node.GET_SCHEMA().validate()
          PY

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: comfy-org/node-diff@main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run unit and modernization contract tests
        run: python -m pytest -q

      - name: Smoke test against ComfyUI v0.27.0 public API
        run: |
          git clone --depth 1 --branch v0.27.0 https://github.com/Comfy-Org/ComfyUI.git ../ComfyUI-v0.27.0
          mkdir -p ../ComfyUI-v0.27.0/custom_nodes
          ln -s "$GITHUB_WORKSPACE" ../ComfyUI-v0.27.0/custom_nodes/bubba_nodes
          python -m pip install -r ../ComfyUI-v0.27.0/requirements.txt
          python - <<'PY'
          import asyncio
          import importlib
          import sys

          sys.path.insert(0, "../ComfyUI-v0.27.0")
          sys.path.insert(0, "../ComfyUI-v0.27.0/custom_nodes")
          module = importlib.import_module("bubba_nodes")
          extension = asyncio.run(module.comfy_entrypoint())
          nodes = asyncio.run(extension.get_node_list())
          assert len(nodes) == 37
          for node in nodes:
              node.GET_SCHEMA().validate()
          PY

      - name: Smoke test frontend extensions against v0.27.0 frontend package
        run: |
          python -c "from importlib.metadata import version; print('comfyui-frontend-package', version('comfyui-frontend-package'))"
          find web/comfyui -name '*.js' -print0 | xargs -0 -n1 node --check

  comfyui-main-warning:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Smoke test against current ComfyUI main
        run: |
          python -m pip install --upgrade pip
          git clone --depth 1 https://github.com/Comfy-Org/ComfyUI.git ../ComfyUI-main
          mkdir -p ../ComfyUI-main/custom_nodes
          ln -s "$GITHUB_WORKSPACE" ../ComfyUI-main/custom_nodes/bubba_nodes
          python -m pip install -e ".[dev]"
          python -m pip install -r ../ComfyUI-main/requirements.txt
          python - <<'PY'
          import asyncio
          import importlib
          import sys

          sys.path.insert(0, "../ComfyUI-main")
          sys.path.insert(0, "../ComfyUI-main/custom_nodes")
          module = importlib.import_module("bubba_nodes")
          extension = asyncio.run(module.comfy_entrypoint())
          nodes = asyncio.run(extension.get_node_list())
          assert len(nodes) == 37
          for node in nodes:
              node.GET_SCHEMA().validate()
          PY

      - name: Smoke test frontend extensions against current frontend package
        run: |
          python -c "from importlib.metadata import version; print('comfyui-frontend-package', version('comfyui-frontend-package'))"
          find web/comfyui -name '*.js' -print0 | xargs -0 -n1 node --check
